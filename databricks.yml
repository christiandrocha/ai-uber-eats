bundle:
  name: ai-uber-eats

workspace:
  host: https://dbc-f3701868-1581.cloud.databricks.com
  profile: dbc-f3701868-1581

variables:
  catalog:
    default: aiubereats
  schema:
    default: payments
  volume:
    default: raw_json

resources:
  jobs:
    medallion_pipeline:
      name: ai-uber-eats-medallion-pipeline

      email_notifications:
        on_failure:
          - christiandr@gmail.com

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: gold
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ./notebooks/03_gold.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f3701868-1581.cloud.databricks.com