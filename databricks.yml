bundle:
  name: ai-uber-eats

workspace:
  host: https://dbc-f3701868-1581.cloud.databricks.com

variables:
  catalog:
    default: aiubereats
  schema:
    default: payments
  volume:
    default: raw_json

resources:
  jobs:
    medallion_pipeline:
      name: ai-uber-eats-medallion-pipeline

      email_notifications:
        on_failure:
          - christiandr@gmail.com

      tasks:
        - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/01_bronze.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              volume: ${var.volume}

        - task_key: silver
          depends_on:
            - task_key: bronze
          notebook_task:
            notebook_path: ./notebooks/02_silver.ipynb
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        # Gold layer is now handled by dbt (see dbt/ directory).
        # The CD workflow runs: databricks bundle run medallion_pipeline (Bronze + Silver)
        # followed by: dbt run && dbt test

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-f3701868-1581.cloud.databricks.com

  staging:
    mode: production
    workspace:
      host: https://dbc-f3701868-1581.cloud.databricks.com
    variables:
      catalog: aiubereats_staging
      schema: payments

  prod:
    mode: production
    workspace:
      host: https://dbc-f3701868-1581.cloud.databricks.com
    variables:
      catalog: aiubereats
      schema: payments
